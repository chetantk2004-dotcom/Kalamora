name: Kalamora Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: 'basic'

      - name: Verify Gradle installation
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            command -v gradle >/dev/null || { echo "::error::Neither ./gradlew nor gradle was found."; exit 1; }
            gradle --version
          fi

      - name: Ensure environment file exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Configure google-services.json (optional secret override)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found. Firebase Auth and Firestore require a valid Firebase configuration."
          fi

      - name: Prepare debug signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            chmod 600 debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ ! -f debug.keystore ]; then
            echo "::notice::DEBUG_KEYSTORE_BASE64 secret not set. Generating an ephemeral CI debug keystore. For Google Sign-In on physical devices, add your registered debug keystore as DEBUG_KEYSTORE_BASE64 or register this SHA-1 in Firebase Console."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            chmod 600 debug.keystore
          fi

      - name: Build Android Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify Debug APK exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected Debug APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload Kalamora-Android-APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kalamora-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up ephemeral keystore
        if: always()
        run: rm -f debug.keystore
