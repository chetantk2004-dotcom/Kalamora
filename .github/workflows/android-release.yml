name: Kalamora Android Signed Release APK

on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Also build signed Android App Bundle (.aab) for Google Play'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-signed-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate required signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING=0
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing required GitHub Secret: KEYSTORE_BASE64"
            MISSING=1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing required GitHub Secret: STORE_PASSWORD"
            MISSING=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required GitHub Secret: KEY_PASSWORD"
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "Configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in Repository Settings -> Secrets and variables -> Actions. See README.md for step-by-step keystore setup."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: 'basic'

      - name: Verify Gradle installation
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            command -v gradle >/dev/null || { echo "::error::Neither ./gradlew nor gradle was found."; exit 1; }
            gradle --version
          fi

      - name: Ensure environment file exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Configure Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          TARGET_FILE="app/google-services.json"
          if [ -f "$TARGET_FILE" ] && [ -s "$TARGET_FILE" ]; then
            echo "Using existing Firebase configuration present at $TARGET_FILE."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p app
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n' | base64 --decode > "$TARGET_FILE"
            echo "DECODED_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
            echo "Decoded Firebase configuration to $TARGET_FILE from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "::error::Missing Firebase configuration: neither app/google-services.json nor the GitHub Actions secret GOOGLE_SERVICES_JSON_BASE64 was found."
            echo "Download google-services.json for package 'com.kalamora.app' from Firebase Console, base64-encode it, and store it as secret GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi

          if ! jq -e '.project_info.project_id and ([.client[].client_info.android_client_info.package_name] | index("com.kalamora.app") != null)' "$TARGET_FILE" >/dev/null 2>&1; then
            echo "::error::app/google-services.json is invalid JSON or does not contain an Android client for package 'com.kalamora.app'."
            exit 1
          fi
          echo "Verified app/google-services.json contains a valid Firebase client entry for com.kalamora.app."

      - name: Decode upload keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          chmod 600 "${GITHUB_WORKSPACE}/my-upload-key.jks"
          keytool -list -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" -storepass "$STORE_PASSWORD" -alias upload >/dev/null

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:processReleaseGoogleServices :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:processReleaseGoogleServices :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Build Signed Release AAB (optional)
        if: ${{ inputs.build_aab == true }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:bundleRelease --no-daemon --stacktrace
          else
            gradle :app:bundleRelease --no-daemon --stacktrace
          fi

      - name: Verify Signed Release APK and signature
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected signed release APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          else
            echo "::error::apksigner tool not found in ANDROID_HOME/build-tools"
            exit 1
          fi

      - name: Upload Kalamora-Android-Release-APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kalamora-Android-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Kalamora-Android-Release-AAB artifact (optional)
        if: ${{ inputs.build_aab == true }}
        uses: actions/upload-artifact@v7
        with:
          name: Kalamora-Android-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Clean up temporary CI secrets and signing keystore
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ "${DECODED_GOOGLE_SERVICES:-false}" = "true" ]; then
            rm -f app/google-services.json
          fi
