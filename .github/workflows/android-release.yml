name: Kalamora Android Signed Release APK

on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Also build signed Android App Bundle (.aab) for Google Play'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-signed-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING=0
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing required GitHub Secret: KEYSTORE_BASE64"
            MISSING=1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing required GitHub Secret: STORE_PASSWORD"
            MISSING=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required GitHub Secret: KEY_PASSWORD"
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "Configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in Repository Settings -> Secrets and variables -> Actions. See README.md for step-by-step keystore setup."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure environment file exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Configure google-services.json (optional secret override)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is required for Firebase release builds."
            exit 1
          fi

      - name: Decode upload keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          chmod 600 "${GITHUB_WORKSPACE}/my-upload-key.jks"
          keytool -list -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" -storepass "$STORE_PASSWORD" -alias upload >/dev/null

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build Signed Release AAB (optional)
        if: ${{ inputs.build_aab == true }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Signed Release APK and signature
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected signed release APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          else
            echo "::error::apksigner tool not found in ANDROID_HOME/build-tools"
            exit 1
          fi

      - name: Upload Kalamora-Android-Release-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalamora-Android-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Kalamora-Android-Release-AAB artifact (optional)
        if: ${{ inputs.build_aab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Kalamora-Android-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing keystore from runner
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
